# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: calendar
    runtime: node
    region: singapore

    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
